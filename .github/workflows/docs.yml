name: Publish Sphinx Documentation to GitHub Pages

on:
  push:
    branches:
      - main
      - DEV-WSRV/changes_for_future_LTS_v1.0

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless pydantic pytest pytest-cov pytest-asyncio
          pip install sphinx sphinx-rtd-theme myst-parser
          pip install -e .

      - name: Build Sphinx Documentation
        run: |
          python -m sphinx -b html docs/source docs/build/html

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
