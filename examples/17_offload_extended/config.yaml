# Kafka and Offload Configuration File
kafka:
  bootstrap_servers: "localhost:9092"
  client_id: "vision-pipeline-extended"
  offload:
    backend: "redis"
    host: "localhost"
    port: 6379
    password: null
    db: 0
    ttl: 5
    on_expired: "drop"
    formats:
      - "image"
      - "file"
    threshold_kb: 50
    key_prefix: "wkafka:claim:camera_1"
