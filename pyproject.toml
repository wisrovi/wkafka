[tool.poetry]
name = "wkafka"
version = "1.0.4"
description = "A professional, decorator-based Kafka wrapper for Python with built-in support for multimedia and JSON."
authors = ["William Steve Rodriguez Villamizar <wisrovi.rodriguez@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/wisrovi/wkafka"
homepage = "https://github.com/wisrovi/wkafka"
keywords = ["kafka", "wrapper", "decorators", "multimedia", "vision", "opencv"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = ">=3.9,<3.15"
kafka-python-ng = "^2.2.2"
opencv-python = "^4.9.0"
numpy = ">=1.26.0,<3.0.0"
loguru = "^0.7.2"
PyYAML = "^6.0.1"
Pillow = "^10.2.0"
python-snappy = { version = "^0.7.1", optional = true }

[tool.poetry.extras]
snappy = ["python-snappy"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
mypy = "^1.8.0"
ruff = "^0.2.0"
tox = "^4.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
select = ["E", "F", "B", "I"]

[tool.mypy]
strict = true
ignore_missing_imports = true
